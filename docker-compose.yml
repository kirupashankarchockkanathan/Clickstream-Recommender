# Big Data project cluster. Memory limits are sized for a 12 GB WSL2 VM (see notes/PLAN.md).
x-hadoop-common: &hadoop-common
  CORE_CONF_fs_defaultFS: hdfs://namenode:9000
  CORE_CONF_hadoop_http_staticuser_user: root
  HDFS_CONF_dfs_webhdfs_enabled: "true"
  HDFS_CONF_dfs_permissions_enabled: "false"
  HDFS_CONF_dfs_replication: "3"        # HDFS default replication
  HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"

x-yarn-common: &yarn-common
  YARN_CONF_yarn_resourcemanager_hostname: resourcemanager
  YARN_CONF_yarn_resourcemanager_address: resourcemanager:8032
  YARN_CONF_yarn_resourcemanager_scheduler_address: resourcemanager:8030
  YARN_CONF_yarn_resourcemanager_resource___tracker_address: resourcemanager:8031
  YARN_CONF_yarn_scheduler_maximum___allocation___mb: "2048"
  YARN_CONF_yarn_scheduler_minimum___allocation___mb: "256"
  YARN_CONF_yarn_nodemanager_resource_memory___mb: "3584"
  YARN_CONF_yarn_nodemanager_resource_cpu___vcores: "6"
  YARN_CONF_yarn_nodemanager_vmem___check___enabled: "false"
  YARN_CONF_yarn_nodemanager_pmem___check___enabled: "false"
  YARN_CONF_yarn_log___aggregation___enable: "true"
  YARN_CONF_yarn_nodemanager_aux___services: mapreduce_shuffle
  MAPRED_CONF_mapreduce_framework_name: yarn

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    hostname: namenode
    mem_limit: 1280m
    ports: ["9870:9870", "9000:9000"]
    volumes:
      - namenode:/hadoop/dfs/name
      - ./data:/data:ro
    environment:
      <<: *hadoop-common
      CLUSTER_NAME: bda-b9
      HADOOP_HEAPSIZE_MAX: 768m
    networks: [hadoop]

  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    hostname: datanode1
    mem_limit: 768m
    depends_on: [namenode]
    ports: ["9864:9864"]
    volumes: ["datanode1:/hadoop/dfs/data"]
    environment:
      <<: *hadoop-common
      SERVICE_PRECONDITION: "namenode:9870"
      HADOOP_HEAPSIZE_MAX: 384m
    networks: [hadoop]

  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    hostname: datanode2
    mem_limit: 768m
    depends_on: [namenode]
    ports: ["9865:9864"]
    volumes: ["datanode2:/hadoop/dfs/data"]
    environment:
      <<: *hadoop-common
      SERVICE_PRECONDITION: "namenode:9870"
      HADOOP_HEAPSIZE_MAX: 384m
    networks: [hadoop]

  datanode3:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    hostname: datanode3
    mem_limit: 768m
    depends_on: [namenode]
    ports: ["9866:9864"]
    volumes: ["datanode3:/hadoop/dfs/data"]
    environment:
      <<: *hadoop-common
      SERVICE_PRECONDITION: "namenode:9870"
      HADOOP_HEAPSIZE_MAX: 384m
    networks: [hadoop]

  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    hostname: resourcemanager
    mem_limit: 768m
    depends_on: [namenode, datanode1, datanode2, datanode3]
    ports: ["8088:8088"]
    environment:
      <<: [*hadoop-common, *yarn-common]
      SERVICE_PRECONDITION: "namenode:9870 datanode1:9864 datanode2:9864 datanode3:9864"
      HADOOP_HEAPSIZE_MAX: 512m
    networks: [hadoop]

  nodemanager:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    hostname: nodemanager
    mem_limit: 4608m
    depends_on: [resourcemanager]
    ports: ["8042:8042"]
    environment:
      <<: [*hadoop-common, *yarn-common]
      SERVICE_PRECONDITION: "namenode:9870 resourcemanager:8088"
      HADOOP_HEAPSIZE_MAX: 512m
    networks: [hadoop]

  historyserver:
    image: bde2020/hadoop-historyserver:2.0.0-hadoop3.2.1-java8
    hostname: historyserver
    mem_limit: 512m
    depends_on: [resourcemanager]
    ports: ["19888:19888"]
    volumes: ["historyserver:/hadoop/yarn/timeline"]
    environment:
      <<: [*hadoop-common, *yarn-common]
      SERVICE_PRECONDITION: "namenode:9870 resourcemanager:8088"
      HADOOP_HEAPSIZE_MAX: 256m
    networks: [hadoop]

  kafka:
    image: apache/kafka:3.7.0
    hostname: kafka
    mem_limit: 1024m
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx640m"
    volumes: ["kafka:/var/lib/kafka/data"]
    networks: [hadoop]

  postgres:
    image: postgres:16-alpine
    hostname: postgres
    mem_limit: 512m
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: bda
      POSTGRES_PASSWORD: bda_pass
      POSTGRES_DB: shop
    volumes: ["postgres:/var/lib/postgresql/data"]
    networks: [hadoop]

  spark-client:
    build: ./docker/spark-client
    image: bda/spark-client:3.5.1
    hostname: spark-client
    mem_limit: 2048m
    ports: ["4040:4040", "8501:8501"]
    volumes:
      - ./docker/hadoop-conf:/etc/hadoop/conf:ro
      - ./:/workspace
    networks: [hadoop]

volumes:
  namenode:
  datanode1:
  datanode2:
  datanode3:
  historyserver:
  kafka:
  postgres:

networks:
  hadoop:
    driver: bridge
